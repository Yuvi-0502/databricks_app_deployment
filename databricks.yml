bundle:
  name: my-streamlit-bundle

resources:
  apps:
    hello_world_app: 
      name: "local-streamlit-app" 
      source_code_path: ./src
      description: "A local Hello World Streamlit deployment"

targets:
  # 1. Used for your local VS Code terminal (Human user)
  local:
    mode: development
    default: true
    workspace:
      host: https://dbc-e3b1c9bb-b254.cloud.databricks.com

  # 2. Used by GitHub Actions (Service Principal)
  dev:
    # This MUST be 'production' for a Service Principal to deploy it
    mode: production 
    workspace:
      host: https://dbc-e3b1c9bb-b254.cloud.databricks.com